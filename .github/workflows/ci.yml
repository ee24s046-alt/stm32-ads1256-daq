name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Firmware (arm-none-eabi, warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # The point of this step: the firmware is expected to build clean at
      # -Wall -Wextra -Wconversion -Wsign-conversion -Wshadow -Wcast-align.
      # A new warning is a regression, so fail on one rather than letting it
      # accumulate into noise nobody reads.
      - name: Fail on any compiler warning
        run: |
          rm -rf build && cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build 2>&1 | tee out.log
          # Linker notes about newlib's unimplemented _read/_write stubs are
          # expected in a bare-metal --specs=nosys build and are not warnings
          # about this code.
          if grep -E "warning:" out.log | grep -v "is not implemented"; then
            echo "::error::compiler warnings present"
            exit 1
          fi

      - name: Report size
        run: arm-none-eabi-size build/daq.elf

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/daq.elf
            build/daq.bin
            build/daq.hex
            build/daq.map

  unit-tests:
    name: Portable core (native, ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: cmake -B build-host -G Ninja -DDAQ_BUILD_HOST_TESTS=ON
      - name: Build
        run: cmake --build build-host
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  analysis:
    name: Static analysis and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build cppcheck lcov

      # Treat a new cppcheck finding as a build failure. The alternative - a
      # report nobody reads - is worse than not running it: every genuine
      # finding then arrives buried in known noise. Suppressions are inline and
      # carry a comment saying why.
      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --inline-suppr --suppress=missingIncludeSystem --std=c11 \
                   -I firmware/include -I firmware/config \
                   --error-exitcode=1 --quiet \
                   firmware/lib firmware/drivers firmware/core firmware/usb firmware/rtos

      - name: Coverage of the portable core
        run: |
          cmake -B build-cov -G Ninja -DDAQ_BUILD_HOST_TESTS=ON -DDAQ_SANITIZE=OFF \
                -DCMAKE_C_FLAGS="--coverage -O0 -g" \
                -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build-cov
          ctest --test-dir build-cov --output-on-failure
          lcov --capture --directory build-cov --output-file cov.info
          lcov --extract cov.info '*/firmware/lib/*' --output-file cov-lib.info
          lcov --list cov-lib.info

      # The portable core is the part that is testable without hardware, so it
      # is the part that has no excuse. 90 % is the floor, not the target.
      - name: Enforce the coverage floor
        run: |
          RATE=$(lcov --summary cov-lib.info 2>&1 | grep -oP 'lines\.+: \K[0-9.]+')
          echo "line coverage: ${RATE}%"
          awk -v r="$RATE" 'BEGIN { exit (r >= 90.0) ? 0 : 1 }' \
            || { echo "::error::coverage ${RATE}% is below the 90% floor"; exit 1; }

  coefficients:
    name: Generated filter coefficients are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      # firmware/include/fir_coeffs.h and host/ads1256_host/fir_coeffs.json are
      # generated. If someone hand-edits either, the firmware and the host
      # reference stop agreeing and the cross-check that validates both becomes
      # meaningless - silently. Regenerate and fail on any diff.
      - name: Regenerate and diff
        run: |
          python3 tools/design_filter.py
          git diff --exit-code -- firmware/include/fir_coeffs.h \
                                  host/ads1256_host/fir_coeffs.json

  host:
    name: Host tooling
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e "host[dev]"
      - name: Test
        run: cd host && python -m pytest -q
      - name: End-to-end decode path against the simulator
        run: ads1256 selftest
      - name: DSP chain verification
        run: ads1256 dsp
